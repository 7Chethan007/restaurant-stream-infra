name: terraform apply

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for OIDC -> GCP auth, no stored key involved

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # requires a manual approval gate if you add one in repo settings
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - run: terraform apply -auto-approve
